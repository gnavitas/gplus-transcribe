<!DOCTYPE html>
<html>

<head>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #60a5fa;
            --text: #f3f4f6;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.875rem;
            color: #9ca3af;
            margin: 0 0 20px 0;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.875rem;
            padding: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-radius: 8px;
        }

        .footer {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #4b5563;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>G+ Transcribe</h1>
        <p>Right-click any image and select "Translate this Manga Page" to start.</p>

        <div class="status">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></div>
            Extension is active
        </div>

        <div class="footer">
            Powered by Gemini 1.5
        </div>
    </div>
</body>

</html>
